name: iOS unsigned IPA

# Собирает НЕподписанный .ipa на бесплатном macOS-раннере GitHub Actions.
# Подпись делает Sideloadly/AltStore при установке на устройство (Apple ID пользователя).
# Запуск: вкладка Actions → "iOS unsigned IPA" → Run workflow. Артефакт — внизу страницы прогона.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6.2 нужен для ExpoModulesJSI SPM; 26.3 ломает компиляцию → берём 26.2/26.1/26.0)
        run: |
          echo "Доступные Xcode:"; ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26.0*.app /Applications/Xcode_26.1*.app /Applications/Xcode_26.2*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "Xcode 26.0-26.2 не найден!"; ls -d /Applications/Xcode_26*.app; exit 1; fi
          echo "Выбираю $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Expo prebuild (iOS)
        run: npx expo prebuild -p ios --no-install

      - name: CocoaPods
        run: cd ios && pod install

      - name: Build unsigned archive
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename *.xcodeproj .xcodeproj)   # схема приложения = имя .xcodeproj (IrkutskGuide), НЕ Pod-схема
          echo "Workspace=$WS  Scheme=$SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE=""

      - name: Package unsigned IPA
        run: |
          cd ios
          APP=$(ls -d build/App.xcarchive/Products/Applications/*.app | head -1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry irkutsk-unsigned.ipa Payload
          ls -la irkutsk-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: irkutsk-ios-ipa
          path: ios/irkutsk-unsigned.ipa
          if-no-files-found: error
